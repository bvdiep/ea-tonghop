<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;background:#ffffff;}
  svg{display:block;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
</style>
</head>
<body>
<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="#ffffff"/>

  <!-- ===== TIÊU ĐỀ ===== -->
  <text x="800" y="48" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">MÔ HÌNH EA (ENTERPRISE ASSISTANT) — VAI TRÒ CỦA NỀN TẢNG HIỆN TẠI</text>
  <text x="800" y="78" text-anchor="middle" font-size="16" fill="#475569">Nền tảng VDI AI-DX không bị thay thế — trở thành một nguồn dữ liệu quan trọng bên trong trợ lý AI dùng chung</text>

  <!-- ===== LỚP NGƯỜI DÙNG ===== -->
  <rect x="440" y="104" width="720" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="800" y="138" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">NGƯỜI DÙNG — TOÀN CÔNG TY</text>
  <text x="800" y="166" text-anchor="middle" font-size="14.5" fill="#334155">Ban Giám đốc · Kinh doanh · Kế toán · Dự án · Quản lý hợp đồng · PMO</text>

  <!-- Mũi tên người dùng <-> EA -->
  <line x1="690" y1="188" x2="690" y2="236" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <line x1="910" y1="236" x2="910" y2="188" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrAmber)"/>
  <text x="674" y="218" text-anchor="end" font-size="14" fill="#2563eb">Ra lệnh bằng ngôn ngữ tự nhiên</text>
  <text x="926" y="218" text-anchor="start" font-size="14" fill="#b45309">Nhận kết quả: câu trả lời · báo cáo · cảnh báo</text>

  <!-- ===== LỚP EA ===== -->
  <rect x="180" y="240" width="1240" height="230" rx="14" fill="#1e3a8a"/>
  <text x="800" y="280" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">EA — TRỢ LÝ AI DUY NHẤT CHO MỌI PHÒNG BAN</text>
  <text x="800" y="306" text-anchor="middle" font-size="14.5" fill="#93c5fd">Nhân sự không cần biết dữ liệu ở đâu — EA tự tìm đúng nguồn, tự tổng hợp, tự thực hiện</text>

  <g>
    <rect x="210" y="328" width="280" height="106" rx="10" fill="rgba(255,255,255,0.13)" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
    <text x="350" y="368" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Tra cứu &amp; hỏi – đáp</text>
    <text x="350" y="394" text-anchor="middle" font-size="13" fill="#bfdbfe">mọi nguồn dữ liệu,</text>
    <text x="350" y="414" text-anchor="middle" font-size="13" fill="#bfdbfe">kèm dẫn chứng nguồn gốc</text>

    <rect x="510" y="328" width="280" height="106" rx="10" fill="rgba(255,255,255,0.13)" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
    <text x="650" y="368" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Tạo báo cáo &amp; tài liệu</text>
    <text x="650" y="394" text-anchor="middle" font-size="13" fill="#bfdbfe">tự tổng hợp, soạn thảo:</text>
    <text x="650" y="414" text-anchor="middle" font-size="13" fill="#bfdbfe">Word · Excel · PowerPoint</text>

    <rect x="810" y="328" width="280" height="106" rx="10" fill="rgba(255,255,255,0.13)" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
    <text x="950" y="368" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Tự động hóa theo lịch</text>
    <text x="950" y="394" text-anchor="middle" font-size="13" fill="#bfdbfe">báo cáo sáng · tổng hợp tuần</text>
    <text x="950" y="414" text-anchor="middle" font-size="13" fill="#bfdbfe">· cảnh báo biến động</text>

    <rect x="1110" y="328" width="280" height="106" rx="10" fill="rgba(255,255,255,0.13)" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
    <text x="1250" y="368" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Thực hiện hành động</text>
    <text x="1250" y="394" text-anchor="middle" font-size="13" fill="#bfdbfe">gửi email · ghi dữ liệu</text>
    <text x="1250" y="414" text-anchor="middle" font-size="13" fill="#bfdbfe">(luôn có người kiểm duyệt)</text>
  </g>

  <!-- Mũi tên EA <-> MCP -->
  <line x1="740" y1="470" x2="740" y2="522" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <line x1="860" y1="522" x2="860" y2="470" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrAmber)"/>
  <text x="726" y="502" text-anchor="end" font-size="14" fill="#2563eb">Đọc dữ liệu cập nhật trực tiếp</text>
  <text x="874" y="502" text-anchor="start" font-size="14" fill="#b45309">Hành động có kiểm duyệt</text>

  <!-- ===== LỚP MCP ===== -->
  <rect x="120" y="526" width="1360" height="80" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="800" y="560" text-anchor="middle" font-size="17" font-weight="700" fill="#065f46">LỚP KẾT NỐI MỞ (MCP) — "Ổ CẮM CHUẨN" ĐẾN MỌI HỆ THỐNG</text>
  <text x="800" y="588" text-anchor="middle" font-size="13.5" fill="#047857">Thêm hệ thống nguồn mới mà không phải thay đổi kiến trúc</text>

  <text x="300" y="634" text-anchor="end" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1">HỆ THỐNG NGUỒN &amp; DỮ LIỆU</text>

  <!-- Mũi tên MCP -> nguồn -->
  <line x1="335" y1="606" x2="335" y2="642" stroke="#64748b" stroke-width="2" marker-end="url(#arrGray)"/>
  <line x1="720" y1="606" x2="720" y2="642" stroke="#64748b" stroke-width="2" marker-end="url(#arrGray)"/>
  <line x1="1030" y1="606" x2="1030" y2="642" stroke="#64748b" stroke-width="2" marker-end="url(#arrGray)"/>
  <line x1="1340" y1="606" x2="1340" y2="642" stroke="#64748b" stroke-width="2" marker-end="url(#arrGray)"/>

  <!-- ===== THẺ NỀN TẢNG VDI (hero) ===== -->
  <rect x="120" y="646" width="430" height="240" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="335" y="680" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">NỀN TẢNG VDI AI-DX (HIỆN TẠI)</text>
  <rect x="175" y="694" width="320" height="30" rx="15" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="335" y="715" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400e">GIỮ NGUYÊN · TÁI SỬ DỤNG 90–100%</text>
  <g font-size="14" fill="#1f2937">
    <text x="145" y="754">•  Kho 194 dự án · 9.478 file chuẩn hóa</text>
    <text x="145" y="784">•  Tra cứu AI + đối chiếu hóa đơn / sao kê</text>
    <text x="145" y="814">•  Phân quyền · Web · Mobile · API mở</text>
  </g>
  <text x="335" y="860" text-anchor="middle" font-size="14.5" font-weight="700" fill="#166534">→ Một nguồn dữ liệu quan trọng của EA</text>

  <!-- ===== THẺ NGUỒN hàng 1 ===== -->
  <g>
    <rect x="580" y="646" width="280" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="720" y="690" text-anchor="middle" font-size="15.5" font-weight="700" fill="#334155">ZOHO</text>
    <text x="720" y="716" text-anchor="middle" font-size="13.5" fill="#475569">Thanh toán · Bảo lãnh</text>
    <text x="720" y="738" text-anchor="middle" font-size="13.5" fill="#475569">Doanh số · Hoàn ứng</text>

    <rect x="890" y="646" width="280" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1030" y="690" text-anchor="middle" font-size="15.5" font-weight="700" fill="#334155">GOOGLE SHEETS (PMO)</text>
    <text x="1030" y="716" text-anchor="middle" font-size="13.5" fill="#475569">Tiến độ dự án (%)</text>
    <text x="1030" y="738" text-anchor="middle" font-size="13.5" fill="#475569">PnL · Phụ lục hợp đồng</text>

    <rect x="1200" y="646" width="280" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1340" y="690" text-anchor="middle" font-size="15.5" font-weight="700" fill="#334155">CSDL HÀNG HÓA (VDI)</text>
    <text x="1340" y="716" text-anchor="middle" font-size="13.5" fill="#475569">Sản phẩm · Thông số</text>
    <text x="1340" y="738" text-anchor="middle" font-size="13.5" fill="#475569">Giá · Báo giá · Dự phòng</text>
  </g>

  <!-- ===== THẺ NGUỒN hàng 2 (giai đoạn sau) ===== -->
  <g>
    <rect x="580" y="776" width="435" height="110" rx="10" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7,5"/>
    <text x="797" y="820" text-anchor="middle" font-size="15.5" font-weight="700" fill="#334155">KẾ TOÁN &amp; HỆ THỐNG NỘI BỘ</text>
    <text x="797" y="846" text-anchor="middle" font-size="13.5" fill="#475569">Số liệu trực tiếp từ hệ thống gốc</text>
    <text x="797" y="868" text-anchor="middle" font-size="13" fill="#64748b">Kết nối ở giai đoạn đầu lộ trình</text>

    <rect x="1045" y="776" width="435" height="110" rx="10" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7,5"/>
    <text x="1262" y="820" text-anchor="middle" font-size="15.5" font-weight="700" fill="#334155">INTERNET · EMAIL · LỊCH LÀM VIỆC</text>
    <text x="1262" y="846" text-anchor="middle" font-size="13.5" fill="#475569">Nghiên cứu thị trường · Email · Lịch họp</text>
    <text x="1262" y="868" text-anchor="middle" font-size="13" fill="#64748b">Kết nối ở giai đoạn tiếp theo</text>
  </g>

  <!-- ===== CHÚ GIẢI ===== -->
  <g font-size="13.5" fill="#334155">
    <rect x="120" y="916" width="18" height="18" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
    <text x="146" y="930">Nền tảng hiện có — giữ nguyên, tái sử dụng</text>

    <rect x="480" y="916" width="18" height="18" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="506" y="930">Nguồn kết nối trực tiếp ngay từ đầu</text>

    <rect x="800" y="916" width="18" height="18" rx="4" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="826" y="930">Nguồn tích hợp dần theo lộ trình</text>

    <line x1="1120" y1="925" x2="1160" y2="925" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrAmber)"/>
    <text x="1168" y="930">Hành động (có kiểm duyệt)</text>
  </g>

  <text x="800" y="976" text-anchor="middle" font-size="13.5" font-style="italic" fill="#64748b">Chạy song song với hệ hiện tại theo từng tình huống sử dụng — đạt chuẩn mới tắt dần hệ cũ. Nền tảng giữ nguyên, duy trì ổn định.</text>
</svg>
</body>
</html>
